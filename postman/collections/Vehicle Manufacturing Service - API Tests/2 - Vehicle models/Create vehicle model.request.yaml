$kind: http-request
url: "{{baseUrl}}/api/v1/vehicle-models"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "modelCode": "{{modelCode}}",
      "name": "Postman EV",
      "category": "CROSSOVER",
      "powertrain": "ELECTRIC",
      "launchYear": 2026,
      "basePrice": 4250000.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));

      const body = pm.response.json();
      pm.test("Defaults to active", () => pm.expect(body.active).to.eql(true));
      pm.test("Price kept", () => pm.expect(Number(body.basePrice)).to.eql(4250000));
      pm.collectionVariables.set("modelId", body.id);
    language: text/javascript
order: 1000
