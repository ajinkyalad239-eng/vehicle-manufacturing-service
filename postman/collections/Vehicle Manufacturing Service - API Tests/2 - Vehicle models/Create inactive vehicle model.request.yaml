$kind: http-request
url: "{{baseUrl}}/api/v1/vehicle-models"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "modelCode": "{{inactiveModelCode}}",
      "name": "Postman EV",
      "category": "CROSSOVER",
      "powertrain": "ELECTRIC",
      "launchYear": 2026,
      "basePrice": 2600000.00,
      "active": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));

      pm.test("Inactive", () => pm.expect(pm.response.json().active).to.eql(false));
      pm.collectionVariables.set("inactiveModelId", pm.response.json().id);
    language: text/javascript
order: 2000
