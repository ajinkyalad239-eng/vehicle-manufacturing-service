$kind: http-request
url: "{{baseUrl}}/api/v1/vehicle-models?powertrain=ELECTRIC&active=true&size=100"
method: GET
queryParams:
  powertrain: ELECTRIC
  active: "true"
  size: "100"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      pm.test("Every model matches the filters", () => pm.response.json().content.forEach(m => {
          pm.expect(m.powertrain).to.eql("ELECTRIC");
          pm.expect(m.active).to.eql(true);
      }));
    language: text/javascript
order: 8000
