$kind: http-request
url: "{{baseUrl}}/api/v1/vehicle-models/{{modelId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Correct model", () => pm.expect(pm.response.json().modelCode).to.eql(pm.collectionVariables.get("modelCode")));
    language: text/javascript
order: 6000
