$kind: http-request
url: "{{baseUrl}}/api/v1/vehicle-models/{{modelId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "modelCode": "{{modelCode}}",
      "name": "Postman EV Plus",
      "category": "CROSSOVER",
      "powertrain": "ELECTRIC",
      "launchYear": 2026,
      "basePrice": 4250000.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      pm.test("Name updated, still active", () => {
          pm.expect(pm.response.json().name).to.eql("Postman EV Plus");
          pm.expect(pm.response.json().active).to.eql(true);
      });
    language: text/javascript
order: 9000
