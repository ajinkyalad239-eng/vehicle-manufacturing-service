$kind: http-request
name: Cancel second order (PLANNED -> CANCELLED)
url: "{{baseUrl}}/api/v1/production-orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "CANCELLED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Cancelled with end time", () => pm.expect(pm.response.json().actualEndAt).to.be.a("string"));
    language: text/javascript
order: 30000
