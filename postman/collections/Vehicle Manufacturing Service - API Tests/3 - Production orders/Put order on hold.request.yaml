$kind: http-request
url: "{{baseUrl}}/api/v1/production-orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "ON_HOLD"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("On hold", () => pm.expect(pm.response.json().status).to.eql("ON_HOLD"));
    language: text/javascript
order: 22000
