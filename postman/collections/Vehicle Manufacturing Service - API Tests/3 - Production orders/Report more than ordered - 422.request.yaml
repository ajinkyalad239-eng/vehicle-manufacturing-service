$kind: http-request
name: Report more than ordered -> 422
url: "{{baseUrl}}/api/v1/production-orders/{{orderId}}/progress"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "completedQuantity": 801
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 422", () => pm.response.to.have.status(422));
      pm.test("Problem title is 'Business rule violated'", () => pm.expect(pm.response.json().title).to.eql("Business rule violated"));
    language: text/javascript
order: 20000
