$kind: http-request
name: Create order - plant in MAINTENANCE -> 422
url: "{{baseUrl}}/api/v1/production-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plantId": {{maintPlantId}},
      "vehicleModelId": {{modelId}},
      "quantity": 10,
      "priority": "HIGH",
      "plannedStartDate": "{{startDate}}",
      "plannedEndDate": "{{endDate}}",
      "notes": "Created by Postman run {{runId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 422", () => pm.response.to.have.status(422));
      pm.test("Problem title is 'Business rule violated'", () => pm.expect(pm.response.json().title).to.eql("Business rule violated"));
    language: text/javascript
order: 2000
