$kind: http-request
name: Complete from ON_HOLD -> 422
url: "{{baseUrl}}/api/v1/production-orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "COMPLETED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 422", () => pm.response.to.have.status(422));
      pm.test("Problem title is 'Business rule violated'", () => pm.expect(pm.response.json().title).to.eql("Business rule violated"));
    language: text/javascript
order: 23000
