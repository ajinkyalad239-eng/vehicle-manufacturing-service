$kind: http-request
name: Create order - unknown plant -> 404
url: "{{baseUrl}}/api/v1/production-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plantId": 999999999,
      "vehicleModelId": {{modelId}},
      "quantity": 10,
      "priority": "HIGH",
      "plannedStartDate": "{{startDate}}",
      "plannedEndDate": "{{endDate}}",
      "notes": "Created by Postman run {{runId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Problem title is 'Resource not found'", () => pm.expect(pm.response.json().title).to.eql("Resource not found"));
    language: text/javascript
order: 6000
