$kind: http-request
name: Report progress 400/800
url: "{{baseUrl}}/api/v1/production-orders/{{orderId}}/progress"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "completedQuantity": 400
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      pm.test("50% done, still in progress", () => {
          pm.expect(pm.response.json().progressPercent).to.eql(50);
          pm.expect(pm.response.json().status).to.eql("IN_PROGRESS");
      });
    language: text/javascript
order: 18000
