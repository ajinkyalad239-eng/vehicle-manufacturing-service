$kind: http-request
name: Report negative progress -> 400
url: "{{baseUrl}}/api/v1/production-orders/{{orderId}}/progress"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "completedQuantity": -1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Problem title is 'Validation failed'", () => pm.expect(pm.response.json().title).to.eql("Validation failed"));
    language: text/javascript
order: 21000
