$kind: http-request
url: "{{baseUrl}}/api/v1/production-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plantId": {{plantId}},
      "vehicleModelId": {{modelId}},
      "quantity": 50,
      "priority": null,
      "plannedStartDate": "{{startDate}}",
      "plannedEndDate": "{{endDate}}",
      "notes": "Created by Postman run {{runId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));

      pm.test("Priority defaults to MEDIUM", () => pm.expect(pm.response.json().priority).to.eql("MEDIUM"));
      pm.collectionVariables.set("orderId", pm.response.json().id);
    language: text/javascript
order: 29000
