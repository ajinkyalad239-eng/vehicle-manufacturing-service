$kind: http-request
name: Delete plant that has orders -> 422
url: "{{baseUrl}}/api/v1/plants/{{plantId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 422", () => pm.response.to.have.status(422));
      pm.test("Problem title is 'Business rule violated'", () => pm.expect(pm.response.json().title).to.eql("Business rule violated"));
    language: text/javascript
order: 14000
