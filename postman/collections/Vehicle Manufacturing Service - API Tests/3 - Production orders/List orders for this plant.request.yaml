$kind: http-request
url: "{{baseUrl}}/api/v1/production-orders?plantId={{plantId}}"
method: GET
queryParams:
  plantId: "{{plantId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Exactly one order", () => pm.expect(pm.response.json().totalElements).to.eql(1));
    language: text/javascript
order: 10000
