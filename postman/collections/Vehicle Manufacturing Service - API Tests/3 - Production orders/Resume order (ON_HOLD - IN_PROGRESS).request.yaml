$kind: http-request
name: Resume order (ON_HOLD -> IN_PROGRESS)
url: "{{baseUrl}}/api/v1/production-orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "IN_PROGRESS"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      pm.test("Original start time kept", () => {
          const actual = new Date(pm.response.json().actualStartAt).getTime();
          const saved = new Date(pm.collectionVariables.get("actualStartAt")).getTime();
          pm.expect(actual).to.eql(saved);
      });
    language: text/javascript
order: 24000
