$kind: http-request
name: Create order - missing fields -> 400
url: "{{baseUrl}}/api/v1/production-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "quantity": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Problem title is 'Validation failed'", () => pm.expect(pm.response.json().title).to.eql("Validation failed"));

      pm.test("Field errors are listed", () => {
          const errors = pm.response.json().errors;
          ["plantId", "vehicleModelId", "quantity", "plannedStartDate", "plannedEndDate"]
              .forEach(f => pm.expect(errors).to.have.property(f));
      });
    language: text/javascript
order: 7000
