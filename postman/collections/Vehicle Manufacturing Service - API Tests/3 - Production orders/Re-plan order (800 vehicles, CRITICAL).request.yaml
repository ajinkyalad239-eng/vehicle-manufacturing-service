$kind: http-request
url: "{{baseUrl}}/api/v1/production-orders/{{orderId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plantId": {{plantId}},
      "vehicleModelId": {{modelId}},
      "quantity": 800,
      "priority": "CRITICAL",
      "plannedStartDate": "{{startDate}}",
      "plannedEndDate": "{{endDate}}",
      "notes": "Created by Postman run {{runId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      pm.test("Re-planned", () => {
          pm.expect(pm.response.json().quantity).to.eql(800);
          pm.expect(pm.response.json().priority).to.eql("CRITICAL");
      });
    language: text/javascript
order: 12000
