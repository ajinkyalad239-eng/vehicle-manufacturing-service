$kind: http-request
name: List orders - non-numeric plantId -> 400
url: "{{baseUrl}}/api/v1/production-orders?plantId=abc"
method: GET
queryParams:
  plantId: abc
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Problem title is 'Invalid parameter'", () => pm.expect(pm.response.json().title).to.eql("Invalid parameter"));
    language: text/javascript
order: 11000
