$kind: http-request
name: Create production order (1000 vehicles, 5 days, 200/day)
url: "{{baseUrl}}/api/v1/production-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plantId": {{plantId}},
      "vehicleModelId": {{modelId}},
      "quantity": 1000,
      "priority": "HIGH",
      "plannedStartDate": "{{startDate}}",
      "plannedEndDate": "{{endDate}}",
      "notes": "Created by Postman run {{runId}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Plan to start tomorrow and finish 5 days later (inclusive).
      const fmt = d => d.toISOString().substring(0, 10);
      const start = new Date(); start.setUTCDate(start.getUTCDate() + 1);
      const end = new Date(start); end.setUTCDate(end.getUTCDate() + 4);
      const before = new Date(start); before.setUTCDate(before.getUTCDate() - 1);
      pm.collectionVariables.set("startDate", fmt(start));
      pm.collectionVariables.set("endDate", fmt(end));
      pm.collectionVariables.set("dayBeforeStart", fmt(before));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));

      const o = pm.response.json();
      pm.test("Starts PLANNED with no progress", () => {
          pm.expect(o.status).to.eql("PLANNED");
          pm.expect(o.completedQuantity).to.eql(0);
          pm.expect(o.progressPercent).to.eql(0);
          pm.expect(o.actualStartAt).to.eql(null);
      });
      pm.test("Order number format", () => pm.expect(o.orderNumber).to.match(/^PO-\d{8}-[0-9A-F]{6}$/));
      pm.test("Links plant and model", () => {
          pm.expect(o.plantCode).to.eql(pm.collectionVariables.get("plantCode"));
          pm.expect(o.modelCode).to.eql(pm.collectionVariables.get("modelCode"));
      });
      pm.collectionVariables.set("orderId", o.id);
    language: text/javascript
order: 1000
