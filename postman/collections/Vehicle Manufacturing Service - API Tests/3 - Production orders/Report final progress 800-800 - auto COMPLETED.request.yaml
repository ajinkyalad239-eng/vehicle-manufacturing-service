$kind: http-request
name: Report final progress 800/800 -> auto COMPLETED
url: "{{baseUrl}}/api/v1/production-orders/{{orderId}}/progress"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "completedQuantity": 800
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      pm.test("Completed automatically", () => {
          const o = pm.response.json();
          pm.expect(o.status).to.eql("COMPLETED");
          pm.expect(o.progressPercent).to.eql(100);
          pm.expect(o.actualEndAt).to.be.a("string");
      });
    language: text/javascript
order: 25000
