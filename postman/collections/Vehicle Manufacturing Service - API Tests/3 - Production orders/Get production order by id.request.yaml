$kind: http-request
url: "{{baseUrl}}/api/v1/production-orders/{{orderId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Correct order", () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get("orderId"))));
    language: text/javascript
order: 8000
