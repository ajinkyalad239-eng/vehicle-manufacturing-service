$kind: http-request
name: Get production order - unknown id -> 404
url: "{{baseUrl}}/api/v1/production-orders/999999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Problem title is 'Resource not found'", () => pm.expect(pm.response.json().title).to.eql("Resource not found"));
    language: text/javascript
order: 9000
