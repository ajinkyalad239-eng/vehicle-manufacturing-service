$kind: http-request
url: "{{baseUrl}}/api/v1/vehicle-models/{{modelId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "modelCode": "{{modelCode}}",
      "name": "Postman EV",
      "category": "CROSSOVER",
      "powertrain": "ELECTRIC",
      "launchYear": 2026,
      "basePrice": 4250000.00,
      "active": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Inactive", () => pm.expect(pm.response.json().active).to.eql(false));
    language: text/javascript
order: 2000
