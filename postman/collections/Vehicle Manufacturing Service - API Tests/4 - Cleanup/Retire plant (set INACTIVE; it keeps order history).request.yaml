$kind: http-request
url: "{{baseUrl}}/api/v1/plants/{{plantId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "{{plantCode}}",
      "name": "Postman Assembly Plant",
      "city": "Yokohama",
      "country": "Japan",
      "dailyCapacity": 200,
      "status": "INACTIVE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Inactive", () => pm.expect(pm.response.json().status).to.eql("INACTIVE"));
    language: text/javascript
order: 1000
