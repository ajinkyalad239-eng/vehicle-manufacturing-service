$kind: http-request
url: "{{baseUrl}}/actuator/health/readiness"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Status UP", () => pm.expect(pm.response.json().status).to.eql("UP"));
    language: text/javascript
order: 1000
