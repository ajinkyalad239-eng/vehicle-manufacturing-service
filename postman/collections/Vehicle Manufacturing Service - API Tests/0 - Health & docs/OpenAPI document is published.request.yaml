$kind: http-request
url: "{{baseUrl}}/v3/api-docs"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has production-order paths", () => pm.expect(pm.response.json().paths).to.have.property("/api/v1/production-orders"));
    language: text/javascript
order: 3000
