$kind: collection
description: End-to-end tests for every endpoint. Run the whole collection in order (Collection Runner or newman). It creates its own uniquely-named data on each run, so it can be repeated against the same database.
variables:
  runId: ""
  plantCode: ""
  maintPlantCode: ""
  modelCode: ""
  inactiveModelCode: ""
  plantId: ""
  maintPlantId: ""
  modelId: ""
  inactiveModelId: ""
  orderId: ""
  startDate: ""
  endDate: ""
  dayBeforeStart: ""
  actualStartAt: ""
scripts:
  - type: http:afterResponse
    code: |-
      // Runs after EVERY request in the collection.
      pm.test("Correlation id header is returned", () => pm.response.to.have.header("X-Correlation-Id"));
      pm.test("Responds within 2 seconds", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      if (pm.response.code >= 400) {
          pm.test("Errors use application/problem+json", () =>
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json"));
      }
    language: text/javascript
