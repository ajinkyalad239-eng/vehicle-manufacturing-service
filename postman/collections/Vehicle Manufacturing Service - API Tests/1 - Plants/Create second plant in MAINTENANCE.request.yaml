$kind: http-request
url: "{{baseUrl}}/api/v1/plants"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "{{maintPlantCode}}",
      "name": "Postman Plant Under Maintenance",
      "city": "Fukuoka",
      "country": "Japan",
      "dailyCapacity": 500,
      "status": "MAINTENANCE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));

      pm.test("Status is MAINTENANCE", () => pm.expect(pm.response.json().status).to.eql("MAINTENANCE"));
      pm.collectionVariables.set("maintPlantId", pm.response.json().id);
    language: text/javascript
order: 5000
