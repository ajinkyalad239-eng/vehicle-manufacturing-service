$kind: http-request
name: Update plant capacity to 200/day
url: "{{baseUrl}}/api/v1/plants/{{plantId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "{{plantCode}}",
      "name": "Postman Assembly Plant",
      "city": "Yokohama",
      "country": "Japan",
      "dailyCapacity": 200
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      pm.test("Capacity updated, status kept", () => {
          pm.expect(pm.response.json().dailyCapacity).to.eql(200);
          pm.expect(pm.response.json().status).to.eql("ACTIVE");
      });
    language: text/javascript
order: 12000
