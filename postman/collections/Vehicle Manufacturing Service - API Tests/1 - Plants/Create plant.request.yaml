$kind: http-request
url: "{{baseUrl}}/api/v1/plants"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "{{plantCode}}",
      "name": "Postman Assembly Plant",
      "city": "Yokohama",
      "country": "Japan",
      "dailyCapacity": 150
    }
scripts:
  - type: beforeRequest
    code: |-
      // Unique suffix per run so the collection can be run repeatedly against the same database.
      const runId = Math.random().toString(36).substring(2, 8).toUpperCase();
      pm.collectionVariables.set("runId", runId);
      pm.collectionVariables.set("plantCode", "PM-" + runId);
      pm.collectionVariables.set("maintPlantCode", "PM-M-" + runId);
      pm.collectionVariables.set("modelCode", "PMM-" + runId);
      pm.collectionVariables.set("inactiveModelCode", "PMI-" + runId);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));

      const body = pm.response.json();
      pm.test("Location header points to new plant", () =>
          pm.expect(pm.response.headers.get("Location")).to.match(new RegExp("/api/v1/plants/" + body.id + "$")));
      pm.test("Fields are echoed back", () => {
          pm.expect(body.code).to.eql(pm.collectionVariables.get("plantCode"));
          pm.expect(body.dailyCapacity).to.eql(150);
          pm.expect(body.status).to.eql("ACTIVE");
          pm.expect(body.createdAt).to.be.a("string");
      });
      pm.collectionVariables.set("plantId", body.id);
    language: text/javascript
order: 1000
