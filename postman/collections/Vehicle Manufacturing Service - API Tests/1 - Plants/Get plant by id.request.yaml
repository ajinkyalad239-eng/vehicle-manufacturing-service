$kind: http-request
url: "{{baseUrl}}/api/v1/plants/{{plantId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Correct plant", () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get("plantId"))));
    language: text/javascript
order: 6000
