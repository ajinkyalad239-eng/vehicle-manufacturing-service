$kind: http-request
url: "{{baseUrl}}/api/v1/plants?status=MAINTENANCE&size=100"
method: GET
queryParams:
  status: MAINTENANCE
  size: "100"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      const page = pm.response.json();
      pm.test("Page shape", () => {
          pm.expect(page.content).to.be.an("array");
          ["page", "size", "totalElements", "totalPages", "last"].forEach(k => pm.expect(page).to.have.property(k));
      });
      pm.test("Every plant matches the filter", () => page.content.forEach(p => pm.expect(p.status).to.eql("MAINTENANCE")));
    language: text/javascript
order: 8000
