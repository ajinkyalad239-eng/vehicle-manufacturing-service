$kind: http-request
name: List plants - unknown status -> 400
url: "{{baseUrl}}/api/v1/plants?status=BROKEN"
method: GET
queryParams:
  status: BROKEN
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Problem title is 'Invalid parameter'", () => pm.expect(pm.response.json().title).to.eql("Invalid parameter"));
    language: text/javascript
order: 9000
