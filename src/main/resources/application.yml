spring:
  application:
    name: vehicle-manufacturing-service

  # Values come from environment variables (Docker / Kubernetes) with local defaults.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/manufacturing}
    username: ${DB_USERNAME:manufacturing}
    password: ${DB_PASSWORD:manufacturing}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  # Access tokens are issued by Keycloak (realm "manufacturing").
  #   issuer-uri  : must equal the "iss" claim inside tokens (the URL clients use to log in)
  #   jwk-set-uri : where this app downloads Keycloak's public signing keys (may be an internal URL)
  #   audiences   : the token must be meant for this API
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/manufacturing}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8180/realms/manufacturing/protocol/openid-connect/certs}
          audiences: ${OAUTH2_AUDIENCE:vehicle-manufacturing-api}

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /actuator/health/readiness
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
  level:
    root: INFO
    com.example.manufacturing: ${APP_LOG_LEVEL:INFO}
