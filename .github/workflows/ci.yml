name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit + controller tests, Testcontainers integration tests and the 100% coverage gate
      - name: Build, test and check coverage
        run: mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  api-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL, Keycloak and the API
        run: docker compose up -d --build

      - name: Wait until Keycloak and the API are ready
        run: |
          for i in $(seq 1 100); do
            if curl -sf http://localhost:8180/realms/manufacturing >/dev/null \
               && curl -sf http://localhost:8080/actuator/health/readiness; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs keycloak app
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Postman collection with newman
        run: |
          npx --yes newman run postman/vehicle-manufacturing.postman_collection.json \
            -e postman/local.postman_environment.json \
            --reporters cli,junit --reporter-junit-export target/newman-report.xml

      - name: Upload newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: target/newman-report.xml

      - name: Stop containers
        if: always()
        run: docker compose down -v
