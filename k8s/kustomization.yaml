# Deploy everything with:  kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: manufacturing
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - keycloak.yaml
  - app.yaml
  - ingress.yaml
configMapGenerator:
  # Same realm file docker-compose uses: roles, Postman client and test users.
  - name: keycloak-realm
    files:
      - keycloak/manufacturing-realm.json
generatorOptions:
  disableNameSuffixHash: true
