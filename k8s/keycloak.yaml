# Keycloak for dev/test clusters (dev mode, in-memory storage, realm imported on start-up).
# In production use your organisation's identity provider or a Keycloak installation with its
# own database and HTTPS, and point OAUTH2_ISSUER_URI / OAUTH2_JWK_SET_URI at it.
#
# Reach it from your PC with:
#   kubectl -n manufacturing port-forward svc/keycloak 8180:8180
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: manufacturing
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8180
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: manufacturing
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.0
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: KC_HOSTNAME
              value: http://localhost:8180
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
# PLACEHOLDER CREDENTIALS - replace before deploying anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: manufacturing
type: Opaque
stringData:
  username: admin
  password: change-me-in-production
