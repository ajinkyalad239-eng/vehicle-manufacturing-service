apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-manufacturing-service
  namespace: manufacturing
  labels:
    app.kubernetes.io/name: vehicle-manufacturing-service
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # zero-downtime deploys
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vehicle-manufacturing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vehicle-manufacturing-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replace with your registry image, e.g. ghcr.io/<org>/vehicle-manufacturing-service:1.0.0
          image: vehicle-manufacturing-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: manufacturing-config
            - secretRef:
                name: manufacturing-db-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30      # up to 150 s to start (Flyway migrations on first boot)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]   # let the Service stop routing before shutdown
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-manufacturing-service
  namespace: manufacturing
  labels:
    app.kubernetes.io/name: vehicle-manufacturing-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vehicle-manufacturing-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vehicle-manufacturing-service
  namespace: manufacturing
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vehicle-manufacturing-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vehicle-manufacturing-service
  namespace: manufacturing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vehicle-manufacturing-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
