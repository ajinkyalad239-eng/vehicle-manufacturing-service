# Exposes the API at http://manufacturing.local (requires an NGINX ingress controller;
# on minikube: `minikube addons enable ingress`, then map manufacturing.local to `minikube ip` in /etc/hosts).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vehicle-manufacturing-service
  namespace: manufacturing
spec:
  ingressClassName: nginx
  rules:
    - host: manufacturing.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vehicle-manufacturing-service
                port:
                  name: http
